name: Enrich Japan policy details

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Checkpoint after this many attempted Japan items"
        required: false
        default: "5"
      max_items:
        description: "Maximum pending items this run (0 = all)"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: policy-data-writes
  cancel-in-progress: false

jobs:
  enrich-japan:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Enrich and publish each checkpoint
        id: enrichment
        timeout-minutes: 330
        continue-on-error: true
        shell: bash
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          JP_ENRICH_BATCH_SIZE: ${{ inputs.batch_size }}
          JP_ENRICH_MAX_ITEMS: ${{ inputs.max_items }}
        run: bash scraper/enrich_japan_checkpoints.sh

      - name: Report enrichment failure
        if: steps.enrichment.outcome == 'failure'
        run: exit 1
