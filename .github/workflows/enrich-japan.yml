name: Enrich Japan policy details

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Checkpoint after this many attempted Japan items"
        required: false
        default: "5"
      max_items:
        description: "Maximum pending items this run (0 = all)"
        required: false
        default: "0"

permissions:
  contents: write

jobs:
  enrich-japan:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    concurrency:
      group: enrich-japan-data
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Enrich Japan items
        id: enrichment
        timeout-minutes: 330
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          JP_ENRICH_BATCH_SIZE: ${{ inputs.batch_size }}
          JP_ENRICH_MAX_ITEMS: ${{ inputs.max_items }}
        run: python scraper/enrich_japan.py

      - name: Commit checkpoints
        if: always()
        run: |
          git config user.name "policy-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet || git commit -m "enrich Japan policy details $(date -u +%F)"
          git push

      - name: Report enrichment failure
        if: steps.enrichment.outcome == 'failure'
        run: exit 1
