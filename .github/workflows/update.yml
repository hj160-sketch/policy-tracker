name: 每日更新政策数据

on:
  schedule:
    - cron: "0 23 * * *"   # UTC 23:00 = 北京时间早上 7:00
  workflow_dispatch:        # 支持手动触发

permissions:
  contents: write

concurrency:
  group: policy-data-writes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 抓取并分析
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scraper/main.py

      - name: 补齐日本政策中文详解
        id: japan_enrichment
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          JP_ENRICH_BATCH_SIZE: "5"
          JP_ENRICH_MAX_ITEMS: "20"
        run: bash scraper/enrich_japan_checkpoints.sh

      - name: 提交更新
        run: |
          git config user.name "policy-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet || git commit -m "data update $(date -u +%F)"
          git push

      - name: 报告日本政策补齐失败
        if: steps.japan_enrichment.outcome == 'failure'
        run: exit 1
